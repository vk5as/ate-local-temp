name: CI

# Run the test suite on every push across the supported platforms and Python
# versions. Per the spec's testing decisions, that is Windows and Linux, each on
# CPython 3.13 and 3.14 (GIL builds).

on:
  push:
    branches:
      - main
      - "integration/*"
      - "ticket-*"

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # conftest.py builds the shared QApplication with no `platform=` kwarg (this PyQt6 build's
      # binding does not accept one), so Qt's offscreen platform has to come from the environment:
      # without it every test that needs `app` fails on a headless runner. Job level, so both the
      # Ubuntu and Windows matrix entries get it.
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0t64 libdbus-1-3 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxtst6 libxkbcommon0 libxkbfile1 \
            libasound2t64 libfontconfig1 fontconfig fonts-dejavu-core \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install ATE and test extras (editable)
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest
