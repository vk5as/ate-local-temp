name: CI

# Run the test suite on every push across the supported platforms and Python
# versions. Per the spec's testing decisions, that is Windows and Linux, each on
# CPython 3.13 and 3.14 (GIL builds).

on:
  push:
    branches:
      - main
      - "integration/*"
      - "ticket-*"

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${matrix.python-version})
    runs-on: ${{ matrix.os }}
    env:
      # conftest.py builds the shared QApplication with no `platform=` kwarg (this PyQt6 build's
      # binding does not accept one), so Qt's offscreen platform has to come from the environment:
      # without it every test that needs `app` fails on a headless runner. Job level, so both the
      # Ubuntu and Windows matrix entries get it.
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ATE and test extras (editable)
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest
